# Automatische Tests bei jedem Push und Pull Request (Playwright, Chromium)
name: Tests

on:
  push:
    branches: [main, dev, hotfix]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Testversion: nach grünen Tests auf dev die Seite neu veröffentlichen (main bleibt, dev kommt unter /dev/).
  # Der Pages-Workflow läuft auf main, weil nur main auf GitHub Pages veröffentlichen darf.
  deploy-test:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy.yml --ref main -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

