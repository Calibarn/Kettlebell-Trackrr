# Automatische Tests bei jedem Push und Pull Request (Playwright, Chromium)
name: Tests

on:
  push:
    branches: [main, dev, hotfix]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Safari-Engine: kurzer Rundgang in WebKit. Blockiert nichts (Linux-WebKit ist nicht iOS-Safari), zeigt aber JavaScript-Fehler früh.
  webkit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/smoke.spec.js --browser=webkit

  # Datenprüfung: Live (main) → Test (dieser Stand), Sicherungen hin und zurück, Sync – keine Nutzerdaten dürfen verloren gehen.
  # Auf main selbst gibt es nichts zu vergleichen.
  upgrade-check:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/upgrade-check.js --base origin/main --head HEAD --report upgrade-bericht.md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: upgrade-bericht
          path: upgrade-bericht.md
          retention-days: 30

  # Testversion: nach grünen Tests und grüner Datenprüfung auf dev die Seite neu veröffentlichen (main bleibt, dev kommt unter /dev/).
  # Der Pages-Workflow läuft auf main, weil nur main auf GitHub Pages veröffentlichen darf.
  deploy-test:
    needs: [test, upgrade-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy.yml --ref main -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

